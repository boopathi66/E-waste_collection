apiVersion: apps/v1
kind: Deployment
metadata:
  name: e-waste-portal
  labels:
    app: e-waste-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: e-waste-portal
  template:
    metadata:
      labels:
        app: e-waste-portal
    spec:
      containers:
        - name: e-waste-portal-container
          image: boopathi0499/e-waste-portal:latest
          ports:
            - containerPort: 8080

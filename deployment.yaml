apiVersion: apps/v1
kind: Deployment
metadata:
 name: e-waste-portal
spec:
 replicas: 2
 selector:
 matchLabels:
 app: e-waste-portal
 template:
 metadata:
 labels:
 app: e-waste-portal
 spec:
 containers:
 - name: html-demo
 image: boopathi0499/e-waste-portal:latest
 ports:
 - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
 name: e-waste-portal-service
spec:
 type: NodePort
 selector:
 app: e-waste-portal
 ports:
 - port: 80
 targetPort: 80
 nodePort: 30010
